name: Medir cupo de la PNFG

# Experimento, no producción: sólo se lanza a mano. Mide a qué ritmo se recarga
# el cupo de resultados.rfef.es sin llegar a cortarlo (tools/pnfg_quota_probe.py,
# CLAUDE.md §6.55). Cada estrategia es un job aparte para que tenga su propia IP
# limpia: el corte es por IP y escala con cada exceso, así que dos estrategias
# en la misma IP se contaminarían entre sí.
#
# No toca datos ni publica nada. Unas 30-50 peticiones por job.

on:
  workflow_dispatch:
    inputs:
      experimento:
        description: 'recarga (¿se recarga el cupo parando antes?) o ciclos (¿escalan los cortes si se esperan en silencio?)'
        required: true
        default: 'recarga'
        type: choice
        options: ['recarga', 'ciclos']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        # recarga: 1/min · 1 cada 2 min · 6+5 min · 10+10 min · 10+30 min
        # ciclos:  6 cortes esperando 330 s · 6 cortes esperando 600 s
        plan: ${{ fromJSON(inputs.experimento == 'ciclos' && '["ciclos:6:330","ciclos:6:600"]' || '["ritmo:60:40","ritmo:120:30","rafaga:6:300:8","rafaga:10:600:4","rafaga:10:1800:2"]') }}
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python tools/pnfg_quota_probe.py '${{ matrix.plan }}'
