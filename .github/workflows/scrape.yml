name: Scrape leagues data

on:
  # Completo cada día, todo el año. Desde octubre de 2026 el calendario de un
  # grupo entero es UNA petición (`NFG_VisCalendario_Vis`) y a `NFG_CmpJornada`
  # solo se le piden las jornadas recién jugadas que no tienen acta. Un run son
  # unas 40-60 peticiones en tandas de 8 con 15 min de silencio entre ellas
  # (`scrapers/pnfg_pacer.py`), así que dura 1-2 h y casi todo es esperar. Antes
  # eran ~360 peticiones, el cupo de ~12 de la PNFG cortaba siempre hacia la
  # J12, y por eso el completo solo corría los lunes.
  #
  # El modo `equipos` se queda para lanzarlo a mano.
  schedule:
    - cron: '0 6 * * *'
  # Manual: trigger desde la pestaña Actions
  workflow_dispatch:
    inputs:
      season:
        description: 'Temporada (formato YYYY-YYYY). Vacío = auto-detectar según fecha actual.'
        required: false
        default: ''
      no_badges:
        description: 'No consultar el portal de escudos (la allowlist curada se aplica igual)'
        required: false
        default: false
        type: boolean
      mode:
        description: 'completo (equipos + calendario + actas, 1-2 h) o equipos'
        required: false
        default: 'completo'
        type: choice
        options: ['completo', 'equipos']

permissions:
  contents: write

jobs:
  scrape:
    # PLAN B (docs/plan-b-runner-casa.md): si algún día la PNFG bloquea las IP
    # de GitHub, se pone la variable del repo SCRAPER_RUNNER=self-hosted y el
    # mismo workflow corre en un PC de casa, con su IP. Sin la variable, aquí.
    runs-on: ${{ vars.SCRAPER_RUNNER || 'ubuntu-latest' }}
    # bash también en el PC de casa (Windows con Git Bash): los pasos lo usan.
    defaults:
      run:
        shell: bash
    env:
      # Sin esto Python escribe a un pipe con buffer y todo el log del scraper
      # sale con la marca de tiempo del final: el run del 2026-09-28 tenía
      # 38 minutos de trabajo estampados en el mismo segundo, y así no se podía
      # medir cuánto duraba un bloqueo de la PNFG.
      PYTHONUNBUFFERED: '1'
      # Segundos entre peticiones a resultados.rfef.es. Es cortesía, no lo que
      # evita el corte: la PNFG corta tras ~12 peticiones vayan al ritmo que
      # vayan (medido, ver scrapers/pnfg_pacer.py). Subirlo sólo alarga el run.
      PNFG_INTERVAL: '6'
      # Lo que SÍ evita el corte (scrapers/pnfg_pacer.py, medido en octubre de
      # 2026): el cupo de ~11 es de NFG_CmpJornada y no se recarga en 15 min,
      # así que esa página solo se usa para actas y con tope por run (2 por
      # grupo, 8 en total); lo demás va en tandas de 6 con 900 s de silencio.
      # Si algún día corta, bajar PNFG_ACTAS_MAX antes que nada.
      PNFG_BURST: '6'
      PNFG_REST: '900'
      PNFG_ACTAS_MAX: '8'
      PNFG_ACTAS_GROUP: '2'
      # Tope de la fase de calendario. El job muere a las 6 h sin publicar;
      # mejor parar antes y publicar lo que haya. El run siguiente empieza por
      # las jornadas que falten.
      PNFG_CALENDAR_MINUTES: '250'
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Los tests no tocan la red: parsean fixtures de HTML real capturado de
      # la PNFG. Van antes del scrape porque un run cuesta varios minutos de
      # peticiones a la federación, y no tiene sentido gastarlas si los parsers
      # están rotos.
      - name: Run tests
        run: python -m unittest discover -s tests -v

      # Qué modo toca:
      #   - workflow_dispatch → lo que haya elegido quien lo lanza.
      #   - cron              → siempre completo.
      - name: Decidir modo
        id: modo
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"
          else
            MODE="completo"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Modo: $MODE"

      - name: Run scraper
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.season }}" ]; then
            ARGS="--season ${{ github.event.inputs.season }}"
          fi
          if [ "${{ github.event.inputs.no_badges }}" = "true" ]; then
            ARGS="$ARGS --no-badges"
          fi
          if [ "${{ steps.modo.outputs.mode }}" = "equipos" ]; then
            ARGS="$ARGS --teams-only"
          fi
          python scrape.py $ARGS

      # Si la PNFG cortó, el run publica igual —lo que falta sale de la caché y
      # del JSON anterior— pero tiene que verse: es la señal de que el cupo ha
      # cambiado o de que bloquean estas IP, y de que toca mirar el plan B.
      - name: Avisar si la PNFG cortó
        run: |
          if grep -q "la PNFG cortó a mitad de run" output/leagues.json; then
            echo "::warning title=La PNFG ha cortado::El run se paró al primer corte y publicó lo que tenía. Si se repite, ver docs/plan-b-runner-casa.md"
          fi

      - name: Show diff
        run: |
          echo "=== output/leagues.json ==="
          head -40 output/leagues.json
          echo "..."
          wc -l output/leagues.json

      # Persistir las cachés acumulativas (escudos + actaUrls) de vuelta a main.
      # Sin este commit el scraper regeneraba desde cero en cada run y las
      # cachés nunca acumulaban — el archivo en disco se tiraba con el container.
      - name: Commit caches back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Solo committeamos cambios en los ficheros de caché. El resto del repo
          # queda intacto.
          git add data/badges-cache.json data/calendar-cache.json
          if git diff --cached --quiet; then
            echo "Sin cambios en las cachés"
          else
            git commit -m "chore: refresh data caches [skip ci]"
            git push origin main
          fi

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
          keep_files: false
          commit_message: 'chore: refresh leagues.json'
