name: Scrape leagues data

on:
  schedule:
    # Diario en julio-agosto-septiembre. Es la pretemporada: las divisiones van
    # apareciendo de una en una según cada competición abre (las masculinas de
    # LNFS, semanas por detrás de las femeninas). Con el cron semanal, una
    # división publicada un martes tardaba hasta 7 días en salir + hasta 24 h de
    # caché de la app: ocho días en los que la entrenadora no encuentra su liga.
    - cron: '0 6 * 7-9 *'
    # Semanal el resto del año, que es cuando ya solo cambian renombrados,
    # bajas a mitad de temporada y actas nuevas.
    - cron: '0 6 * * 1'
  # Manual: trigger desde la pestaña Actions
  workflow_dispatch:
    inputs:
      season:
        description: 'Temporada (formato YYYY-YYYY). Vacío = auto-detectar según fecha actual.'
        required: false
        default: ''
      no_badges:
        description: 'Saltar resolución de escudos via Wikipedia'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Los tests no tocan la red: parsean fixtures de HTML real capturado de
      # la PNFG. Van antes del scrape porque un run cuesta varios minutos de
      # peticiones a la federación, y no tiene sentido gastarlas si los parsers
      # están rotos.
      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run scraper
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.season }}" ]; then
            ARGS="--season ${{ github.event.inputs.season }}"
          fi
          if [ "${{ github.event.inputs.no_badges }}" = "true" ]; then
            ARGS="$ARGS --no-badges"
          fi
          python scrape.py $ARGS

      - name: Show diff
        run: |
          echo "=== output/leagues.json ==="
          head -40 output/leagues.json
          echo "..."
          wc -l output/leagues.json

      # Persistir las cachés acumulativas (escudos + actaUrls) de vuelta a main.
      # Sin este commit el scraper regeneraba desde cero en cada run y las
      # cachés nunca acumulaban — el archivo en disco se tiraba con el container.
      - name: Commit caches back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Solo committeamos cambios en los ficheros de caché. El resto del repo
          # queda intacto.
          git add data/badges-cache.json data/calendar-cache.json
          if git diff --cached --quiet; then
            echo "Sin cambios en las cachés"
          else
            git commit -m "chore: refresh data caches [skip ci]"
            git push origin main
          fi

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
          keep_files: false
          commit_message: 'chore: refresh leagues.json'
