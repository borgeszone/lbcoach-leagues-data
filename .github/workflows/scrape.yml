name: Scrape leagues data

on:
  # Dos trabajos con cadencias distintas, porque cuestan cosas muy distintas:
  #
  #   solo equipos  ~1 min   2 jornadas por grupo. Es lo que cambia en agosto,
  #                          cuando las divisiones van abriendo de una en una.
  #   completo      ~3 h     las ~30 jornadas de cada grupo, contra el
  #                          rate-limit de la PNFG. El calendario de una
  #                          temporada apenas cambia; lo que cambia dentro son
  #                          las actas, y esas ya tienen caché acumulativa.
  #
  # Hacer el completo a diario en pretemporada era pegarle hora y media al día
  # a la federación desde la misma IP — provocando en parte los bloqueos que
  # luego hacen perder jornadas.
  #
  # Los meses NO se solapan a propósito: si los dos cron casaran el mismo día,
  # GitHub lanzaría dos runs a la vez y competirían por publicar.
  schedule:
    - cron: '0 6 * 7-9 *'            # jul-sep: diario
    - cron: '0 6 * 1-6,10-12 1'      # oct-jun: solo lunes
  # Manual: trigger desde la pestaña Actions
  workflow_dispatch:
    inputs:
      season:
        description: 'Temporada (formato YYYY-YYYY). Vacío = auto-detectar según fecha actual.'
        required: false
        default: ''
      no_badges:
        description: 'No consultar el portal de escudos (la allowlist curada se aplica igual)'
        required: false
        default: false
        type: boolean
      mode:
        description: 'completo (equipos + calendario, ~3h) o equipos (~1 min)'
        required: false
        default: 'completo'
        type: choice
        options: ['completo', 'equipos']

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Los tests no tocan la red: parsean fixtures de HTML real capturado de
      # la PNFG. Van antes del scrape porque un run cuesta varios minutos de
      # peticiones a la federación, y no tiene sentido gastarlas si los parsers
      # están rotos.
      - name: Run tests
        run: python -m unittest discover -s tests -v

      # Qué modo toca:
      #   - workflow_dispatch → lo que haya elegido quien lo lanza.
      #   - cron              → completo los lunes, solo-equipos el resto.
      #     Con el cron de oct-jun eso siempre es lunes = siempre completo; en
      #     jul-sep sale un completo semanal y seis rápidos.
      - name: Decidir modo
        id: modo
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"
          elif [ "$(date -u +%u)" = "1" ]; then
            MODE="completo"
          else
            MODE="equipos"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Modo: $MODE"

      - name: Run scraper
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.season }}" ]; then
            ARGS="--season ${{ github.event.inputs.season }}"
          fi
          if [ "${{ github.event.inputs.no_badges }}" = "true" ]; then
            ARGS="$ARGS --no-badges"
          fi
          if [ "${{ steps.modo.outputs.mode }}" = "equipos" ]; then
            ARGS="$ARGS --teams-only"
          fi
          python scrape.py $ARGS

      - name: Show diff
        run: |
          echo "=== output/leagues.json ==="
          head -40 output/leagues.json
          echo "..."
          wc -l output/leagues.json

      # Persistir las cachés acumulativas (escudos + actaUrls) de vuelta a main.
      # Sin este commit el scraper regeneraba desde cero en cada run y las
      # cachés nunca acumulaban — el archivo en disco se tiraba con el container.
      - name: Commit caches back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Solo committeamos cambios en los ficheros de caché. El resto del repo
          # queda intacto.
          git add data/badges-cache.json data/calendar-cache.json
          if git diff --cached --quiet; then
            echo "Sin cambios en las cachés"
          else
            git commit -m "chore: refresh data caches [skip ci]"
            git push origin main
          fi

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
          keep_files: false
          commit_message: 'chore: refresh leagues.json'
